plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.6'
}

group = 'gg.peastudios'

// pulled from version.properties so the build script can bump it without editing this file
def versionProps = new Properties()
def versionFile = file('version.properties')
if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
}
version = versionProps.getProperty('version', '0.1.0')

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
}

processResources {
    filesMatching('plugin.yml') {
        expand version: project.version
    }
}

shadowJar {
    archiveBaseName.set('PeaShops')
    archiveVersion.set(project.version as String)
    archiveClassifier.set('')
}

jar {
    archiveBaseName.set('PeaShops')
    archiveVersion.set(project.version as String)
}

tasks.named('build') {
    dependsOn shadowJar
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
